<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OncoVision · Treatment what-if</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d; --text:#e6edf3; --muted:#8b98a7;
    --accent:#ff8a3d; --ok:#3fb68b; --warn:#e3b341;
    --c-none:#ff6b6b; --c-rec:#c9d1d9; --c-tmz:#58a6ff; --c-ttf:#3fb68b; --c-bev:#d2a8ff;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
      --accent:#d9480f; --ok:#1a7f5a; --warn:#9a6700; --c-none:#cf222e; --c-rec:#57606a; --c-tmz:#0969da; --c-ttf:#1a7f5a; --c-bev:#8250df;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
  main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px 20px;max-width:1400px;margin:0 auto}
  @media (max-width:860px){main{grid-template-columns:1fr;padding:12px 16px}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  #list{max-height:78vh;overflow:auto}
  #q{width:calc(100% - 20px);margin:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  .row{padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .row:hover{background:var(--panel2)} .row.sel{background:var(--panel2);box-shadow:inset 3px 0 var(--accent)}
  .row small{color:var(--muted)}
  #detail{padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
  .kpi b{display:block;font-size:18px;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi span{color:var(--muted);font-size:12px}
  svg{width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px}
  .legend label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
  .sw{width:14px;height:3px;border-radius:2px;display:inline-block}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:500}
  .note{color:var(--muted);font-size:12px}
  details{margin-top:12px} summary{cursor:pointer;color:var(--muted)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
  button.t{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer}
  #err{padding:16px;color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1><span>Onco</span>Vision · what happens to this tumour under different treatment?</h1>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span id="src" class="note"></span>
    <span class="badge">Illustrative · effects from literature priors · research demo, not clinical advice</span>
  </div>
</header>
<main>
  <section class="panel">
    <input id="q" placeholder="Search patient ID" aria-label="Search patient">
    <div id="list" role="listbox"></div>
  </section>
  <section class="panel" id="detail"><div id="err" hidden></div><div id="body"></div></section>
</main>

<script>
const SCEN = {
  no_further_treatment:{label:"No further treatment", color:"var(--c-none)"},
  as_recorded:{label:"As recorded in the chart", color:"var(--c-rec)"},
  tmz_6_cycles:{label:"Temozolomide, 6 cycles", color:"var(--c-tmz)"},
  tmz_plus_ttfields:{label:"Temozolomide + TTFields", color:"var(--c-ttf)"},
  bevacizumab:{label:"Bevacizumab", color:"var(--c-bev)"},
};
const AGENT_COLOR = {temozolomide:"var(--c-tmz)", ttfields:"var(--c-ttf)", bevacizumab:"var(--c-bev)"};
const AGENT_LABEL = {temozolomide:"Temozolomide", ttfields:"TTFields", bevacizumab:"Bevacizumab", lomustine_pcv:"Lomustine/PCV", immunotherapy:"Immunotherapy"};
let DATA=null, SEL=null, hidden=new Set(), logScale=false;

const fmt = v => v>=1e5 ? (v/1e3).toFixed(0)+" mL" : v>=1e3 ? (v/1e3).toFixed(1)+" mL" : v.toFixed(0)+" mm³";
const pct = v => (v>=0?"+":"")+v.toFixed(0)+"%";

async function load(){
  for (const url of ["data/whatif_cases.json","data-fixture/whatif_cases.json"]) {
    try { const r = await fetch(url); if (r.ok) { document.getElementById("src").textContent = url.startsWith("data-fixture") ? "sample data" : "baked data"; return r.json(); } } catch(e){}
  }
  throw new Error("No what-if data found. Run oncovision.sim.whatif and copy whatif_cases.json to web/data/.");
}

function renderList(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const el = document.getElementById("list"); el.innerHTML="";
  DATA.cases.filter(c=>c.uid.toLowerCase().includes(q)).forEach(c=>{
    const d=document.createElement("div"); d.className="row"+(SEL===c?" sel":""); d.setAttribute("role","option");
    const last=c.observed[c.observed.length-1];
    d.innerHTML=`<span>${c.uid.split(":")[1]}<br><small>${c.observed.length} scans · ${Math.round(last.day)} d</small></span><small>${c.status}</small>`;
    d.onclick=()=>{SEL=c;renderList();renderDetail();}; el.appendChild(d);
  });
}

function chart(c){
  const W=860,H=340,L=64,R=16,T=14,B=34;
  const obs=c.observed;
  const t0=0, tEnd=Math.max(...Object.values(c.scenarios).flatMap(s=>s.day));
  const series=Object.entries(c.scenarios).filter(([k])=>!hidden.has(k));
  const ys=[...obs.map(o=>o.seed_burden_mm3), ...series.flatMap(([,s])=>s.burden_mm3)].filter(v=>v>0);
  const yMin=logScale?Math.min(...ys)*0.8:0, yMax=Math.max(...ys)*1.08;
  const X=t=>L+(t-t0)/(tEnd-t0)*(W-L-R);
  const Y=v=>{ if(logScale){const a=Math.log(Math.max(v,yMin)),lo=Math.log(yMin),hi=Math.log(yMax);return T+(1-(a-lo)/(hi-lo))*(H-T-B);}
               return T+(1-(v-yMin)/(yMax-yMin))*(H-T-B); };
  let g="";
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const v=logScale?Math.exp(Math.log(yMin)+(Math.log(yMax)-Math.log(yMin))*i/ticks):yMin+(yMax-yMin)*i/ticks;
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" fill="var(--muted)" font-size="11" text-anchor="end">${fmt(v)}</text>`;
  }
  const dstep=Math.ceil(tEnd/6/30)*30;
  for(let t=0;t<=tEnd;t+=dstep) g+=`<text x="${X(t)}" y="${H-10}" fill="var(--muted)" font-size="11" text-anchor="middle">${t} d</text>`;
  // last observed scan marker (start of the forecast window)
  const tLast=obs[obs.length-1].day;
  g+=`<line x1="${X(tLast)}" x2="${X(tLast)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${X(tLast)+6}" y="${T+12}" fill="var(--muted)" font-size="11">last scan · forecast →</text>`;
  for(const [k,s] of series){
    const pts=s.day.map((t,i)=>`${X(t).toFixed(1)},${Y(s.burden_mm3[i]).toFixed(1)}`).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${SCEN[k]?.color||'var(--text)'}" stroke-width="2.2" stroke-linejoin="round"/>`;
  }
  const op=obs.map(o=>`${X(o.day).toFixed(1)},${Y(o.seed_burden_mm3).toFixed(1)}`).join(" ");
  g+=`<polyline points="${op}" fill="none" stroke="var(--text)" stroke-width="1.5" opacity=".6"/>`;
  obs.forEach(o=>{g+=`<circle cx="${X(o.day)}" cy="${Y(o.seed_burden_mm3)}" r="4.5" fill="var(--bg)" stroke="var(--text)" stroke-width="2"><title>Scan ${o.tp_index}, day ${Math.round(o.day)}: ${fmt(o.seed_burden_mm3)}</title></circle>`;});
  // recorded treatment timeline
  let tl="", lane=0;
  const sch=c.recorded_schedule;
  const spans=[...sch.drugs.map(d=>({label:AGENT_LABEL[d.agent]||d.agent,color:AGENT_COLOR[d.agent]||"var(--muted)",a:d.start_day,b:d.end_day})),
               ...sch.radiation.map(r=>({label:`Radiation ${r.total_dose_gy} Gy`,color:"var(--warn)",a:r.start_day,b:r.end_day}))];
  spans.forEach((s,i)=>{
    const a=Math.max(t0,s.a), b=Math.min(tEnd,s.b); if(b<=a) return;
    tl+=`<rect x="${X(a)}" y="${H+8+lane*10}" width="${Math.max(2,X(b)-X(a))}" height="7" rx="3" fill="${s.color}" opacity=".85"><title>${s.label}: day ${Math.round(s.a)} to ${Math.round(s.b)}</title></rect>`;
    lane=(lane+1)%4;
  });
  return `<svg viewBox="0 0 ${W} ${H+52}" role="img" aria-label="Tumour burden over time under each scenario">${g}<text x="${L}" y="${H+4}" fill="var(--muted)" font-size="10">recorded treatment</text>${tl}</svg>`;
}

function renderDetail(){
  const c=SEL; if(!c){return;}
  const obs=c.observed, first=obs[0], last=obs[obs.length-1];
  const horizonEnd=Math.max(...Object.values(c.scenarios).flatMap(s=>s.day));
  const rows=Object.entries(c.scenarios).map(([k,s])=>{
    const end=s.burden_mm3[s.burden_mm3.length-1]; const ch=(end/last.seed_burden_mm3-1)*100;
    return `<tr><td><span class="sw" style="background:${SCEN[k]?.color}"></span> ${SCEN[k]?.label||k}</td><td>${fmt(end)}</td><td>${pct(ch)}</td></tr>`;
  }).join("");
  const none=c.scenarios.no_further_treatment, tmz=c.scenarios.tmz_6_cycles;
  const delta=(none&&tmz)?(1-tmz.burden_mm3.at(-1)/none.burden_mm3.at(-1))*100:null;
  const legend=Object.keys(c.scenarios).map(k=>`<label><input type="checkbox" data-k="${k}" ${hidden.has(k)?"":"checked"}><span class="sw" style="background:${SCEN[k]?.color}"></span>${SCEN[k]?.label||k}</label>`).join("");
  const ev=DATA.effects.values, evi=DATA.effects.evidence;
  const evRows=Object.keys(evi).map(a=>`<tr><td>${AGENT_LABEL[a]||a}</td><td>${(ev[a].suppress*100).toFixed(0)}%</td><td class="note">${evi[a]}</td></tr>`).join("");
  document.getElementById("body").innerHTML=`
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
      <h2 style="margin:0;font-size:18px">Patient ${c.uid.split(":")[1]} <span class="note">· ${c.uid.split(":")[0]}</span></h2>
      <div class="controls"><label><input type="checkbox" id="log" ${logScale?"checked":""}> log scale</label></div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>Scans observed</span><b>${obs.length}</b></div>
      <div class="kpi"><span>Span</span><b>${Math.round(last.day)} d</b></div>
      <div class="kpi"><span>Burden at last scan</span><b>${fmt(last.seed_burden_mm3)}</b></div>
      <div class="kpi"><span>Model growth rate ρ</span><b>${c.rho.toFixed(3)} /d</b></div>
      ${delta!==null?`<div class="kpi"><span>TMZ vs none at +${horizonEnd-Math.round(last.day)} d</span><b>${pct(-delta)}</b></div>`:""}
    </div>
    <div class="legend">${legend}</div>
    ${chart(c)}
    <p class="note">Circles are the tumour burden measured at each scan (cell-equivalent volume of the model seed: dense core 0.95, enhancing 0.5, oedema 0.2). Curves simulate forward from the last scan. Bars underneath are the courses recorded in the clinical sheet.</p>
    <table><thead><tr><th>Scenario</th><th>Burden at end of horizon</th><th>vs last scan</th></tr></thead><tbody>${rows}</tbody></table>
    <details open><summary>What the numbers rest on</summary>
      <p class="note">Growth rate ρ is calibrated on this patient's own first interval (${c.status}) and shrunk toward the cohort median. Treatment effects are <b>not</b> estimated from this cohort: in the retrospective data, treated intervals do not grow more slowly than untreated ones because therapy is started when a tumour is progressing. The values below are taken from randomised trials (growth suppression while the agent is active, derived from the progression-free-survival ratio) and are illustrative.</p>
      <table><thead><tr><th>Agent</th><th>Growth suppression</th><th>Evidence</th></tr></thead><tbody>${evRows}</tbody></table>
      ${(c.assumptions&&c.assumptions.length)?`<p class="note">Schedule assumptions for this patient: ${c.assumptions.join("; ")}.</p>`:""}
    </details>`;
  document.querySelectorAll(".legend input").forEach(i=>i.onchange=e=>{ if(i.checked) hidden.delete(i.dataset.k); else hidden.add(i.dataset.k); renderDetail(); });
  const lg=document.getElementById("log"); if(lg) lg.onchange=e=>{logScale=e.target.checked; renderDetail();};
}

(async()=>{
  try{
    DATA=await load();
    SEL=DATA.cases[0]; renderList(); renderDetail();
    document.getElementById("q").oninput=renderList;
  }catch(e){ const el=document.getElementById("err"); el.hidden=false; el.textContent=e.message; }
})();
</script>
</body>
</html>
